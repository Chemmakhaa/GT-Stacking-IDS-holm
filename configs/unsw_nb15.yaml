# Configuration for UNSW-NB15
# Download the official CSV files (UNSW_NB15_training-set.csv, UNSW_NB15_testing-set.csv)
# from https://research.unsw.edu.au/projects/unsw-nb15-dataset and put them in data/raw/unsw_nb15/

dataset:
  name: unsw_nb15
  files:
    - data/raw/unsw_nb15/UNSW_NB15_training-set.csv
    - data/raw/unsw_nb15/UNSW_NB15_testing-set.csv
  drop_columns: [id]
  categorical_columns: [proto, service, state]
  binary_label: label             # 0 = Normal, 1 = Attack
  multiclass_label: attack_cat    # Normal, Fuzzers, Analysis, Backdoor, DoS, ...
  subset_size: null               # null = use all rows; an integer = stratified random subset

task: binary                      # binary | multiclass (can be overridden with --task)

split:
  test_size: 0.2
  seed: 46

cv:
  n_splits: 5                     # 5-fold CV on the training set (Tables 3, 4, 13)
  stacking_cv: 5                  # inner CV of StackingClassifier (out-of-fold meta-features)
  stat_n_splits: 10               # folds used for the paired significance tests (n = 10, df = 9)

pipeline:
  order: [boruta_shap, cwgan_gp]  # order of the two game-theory steps

boruta_shap:
  n_trials: 50
  alpha: 0.05
  shap_sample_size: 2000
  base_model: lightgbm            # model used to compute SHAP importances

cwgan_gp:
  latent_dim: 100
  learning_rate: 0.0001
  generator_hidden: [128, 256]    # 2 hidden layers
  critic_hidden: [512, 256, 128]
  batch_size: 256
  epochs: 300
  n_critic: 5
  gp_lambda: 10
  balance_ratio: 1.0              # each minority class is raised to ratio x majority-class size

models:                           # Table 2 of the paper
  catboost: {iterations: 500, depth: 8, learning_rate: 0.1, l2_leaf_reg: 3}
  xgboost: {n_estimators: 500, max_depth: 8, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8, gamma: 0}
  lightgbm: {n_estimators: 500, max_depth: -1, num_leaves: 64, learning_rate: 0.1, colsample_bytree: 0.8, subsample: 0.8, subsample_freq: 1}
  gradient_boosting: {n_estimators: 500, learning_rate: 0.1, max_depth: 6, subsample: 0.8}
  adaboost: {n_estimators: 200, learning_rate: 1.0}
  random_forest: {n_estimators: 500, max_depth: 12, min_samples_split: 2, min_samples_leaf: 1, bootstrap: true}
  mlp_meta: {hidden: 128, dropout: 0.3, learning_rate: 0.001, batch_size: 128, epochs: 50}

output_dir: results/unsw_nb15
